name: Check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run color tests
        run: node tests/color.test.js
      - name: Validate JSON
        run: node -e "for (const f of ['miniprogram/app.json','sitemap.json','project.config.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON ok')"
      - name: Check README assets
        run: test -s assets/readme/hero.svg && test -s assets/readme/support-cta.svg
