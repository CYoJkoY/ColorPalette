name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run framework-free tests
        run: |
          node tests/color.test.js
          node tests/palette-workspace.test.js
      - name: Validate JSON
        run: node -e "for (const f of ['miniprogram/app.json','sitemap.json','project.config.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON ok')"
      - name: Validate required assets
        run: |
          test -s assets/readme/hero.svg
          test -s assets/readme/support-cta.svg
          test -s assets/readme/icons/palette.svg
          test -s assets/readme/icons/image.svg
          test -s assets/readme/icons/pro.svg
      - name: Validate web files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/preferences.js
          test -s web/i18n.js
          test -s web/runtime-fixes.js
          test -s web/locale-refresh.js
          test -s web/build-data.js
          test -s web/locales/zh-CN.js
          test -s web/locales/en-US.js
      - name: Validate locale resources
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{}};
          vm.createContext(ctx);
          for(const file of ['web/locales/zh-CN.js','web/locales/en-US.js']){
            vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
          }
          const locales=ctx.window.ColorPaletteLocales;
          const zh=locales?.['zh-CN'],en=locales?.['en-US'];
          if(!zh?.ui||!en?.ui||!zh?.relations||!en?.relations||!zh?.relationDescriptions||!en?.relationDescriptions||!zh?.modes||!en?.modes) throw new Error('Locale resources missing');
          const requireKeys=(a,b,path)=>{
            const missing=Object.keys(a).filter(key=>!(key in b));
            if(missing.length) throw new Error(`Missing locale keys at ${path}: ${missing.join(',')}`);
          };
          requireKeys(zh.ui,en.ui,'ui');
          requireKeys(zh.relations,en.relations,'relations');
          requireKeys(zh.relationDescriptions,en.relationDescriptions,'relationDescriptions');
          requireKeys(zh.modes,en.modes,'modes');
          const untranslated=Object.entries(zh.ui).filter(([key,value])=>key!==value&&en.ui[key]===value).map(([key])=>key);
          if(untranslated.length) throw new Error(`Untranslated English UI values: ${untranslated.join(',')}`);
          console.log(`Locale resources OK: ${Object.keys(zh.ui).length} Chinese UI keys, ${Object.keys(en.ui).length} English UI keys, ${Object.keys(zh.modes).length} modes`);
          NODE
      - name: Check JavaScript syntax
        run: |
          find miniprogram tests web -name '*.js' -print0 | xargs -0 -n1 node --check
