name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run framework-free tests
        run: node tests/color.test.js
      - name: Validate JSON
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -r -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" 
          echo 'JSON ok'
      - name: Validate required assets
        run: |
          test -s assets/readme/hero.svg
          test -s assets/readme/support-cta.svg
          test -s assets/readme/icons/palette.svg
          test -s assets/readme/icons/image.svg
          test -s assets/readme/icons/pro.svg
      - name: Validate web files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/preferences-ui.css
          test -s web/create-redesign.css
          test -s web/ui-motion.css
          test -s web/ui-motion.js
          test -s web/preferences-lite.js
          test -s web/i18n.js
          test -s web/ui-shell.js
          test -s web/app-locale.js
          test -s web/build-data.js
          test -s web/locales/zh-CN.js
          test -s web/locales/en-US.js
      - name: Validate locale resources
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{}};
          vm.createContext(ctx);
          for(const file of ['web/locales/zh-CN.js','web/locales/en-US.js']) vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
          const locales=ctx.window.ColorPaletteLocales;
          const zh=locales?.['zh-CN'],en=locales?.['en-US'];
          if(!zh?.ui||!en?.ui||!zh?.relations||!en?.relations||!zh?.relationDescriptions||!en?.relationDescriptions||!zh?.modes||!en?.modes) throw new Error('Locale resources missing');
          const requireKeys=(a,b,path)=>{const missing=Object.keys(a).filter(key=>!(key in b));if(missing.length)throw new Error(`Missing locale keys at ${path}: ${missing.join(',')}`)};
          requireKeys(zh.ui,en.ui,'ui'); requireKeys(en.ui,zh.ui,'ui');
          requireKeys(zh.relations,en.relations,'relations'); requireKeys(en.relations,zh.relations,'relations');
          requireKeys(zh.relationDescriptions,en.relationDescriptions,'relationDescriptions'); requireKeys(en.relationDescriptions,zh.relationDescriptions,'relationDescriptions');
          requireKeys(zh.modes,en.modes,'modes'); requireKeys(en.modes,zh.modes,'modes');
          const keys=Object.keys(zh.ui); if(keys.some(k=>/[\u4e00-\u9fff]/.test(k))) throw new Error(`Locale key contains Chinese text: ${keys.filter(k=>/[\u4e00-\u9fff]/.test(k)).join(',')}`);
          console.log(`Locale resources OK: ${keys.length} shared semantic UI keys`);
          NODE
      - name: Validate generated web data
        run: |
          node web/build-data.js
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('web/data/colors.json','utf8'));
          if(!Array.isArray(d.colors)||!d.colors.length) throw new Error('Generated color data is empty');
          const missing=d.colors.filter(c=>typeof c.nameEn!=='string'||!c.nameEn.trim()); if(missing.length) throw new Error(`Missing English color names: ${missing.length}`);
          const mixed=d.colors.filter(c=>/[\u4e00-\u9fff]/.test(c.nameEn)); if(mixed.length) throw new Error(`English color names contain CJK text: ${mixed.slice(0,5).map(c=>c.name).join(', ')}`);
          console.log(`Generated color data OK: ${d.colors.length} locale-safe colors`);
          NODE
      - name: Reject legacy platform markers
        run: |
          test ! -d miniprogram
          test ! -e project.config.json
          test ! -e sitemap.json
          if git grep -nE '(^|[^A-Za-z])(wx\.|wx:|\.wxml|\.wxss|微信小程序|微信开发者工具)' -- ':!assets/readme'; then
            echo 'Legacy platform markers found.'
            exit 1
          fi
      - name: Check JavaScript syntax
        run: find tests web core -name '*.js' -print0 | xargs -0 -n1 node --check
