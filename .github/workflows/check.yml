name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript tests
        run: npm test
      - name: Type-check source
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.web.json
      - name: Build web TypeScript
        run: npm run build:web
      - name: Validate JSON
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))"
          echo 'JSON ok'
      - name: Validate required assets
        run: |
          test -s assets/readme/hero.svg
          test -s assets/readme/support-cta.svg
          test -s assets/readme/icons/palette.svg
          test -s assets/readme/icons/image.svg
          test -s assets/readme/icons/pro.svg
      - name: Validate web files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/preferences-ui.css
          test -s web/create-redesign.css
          test -s web/ui-motion.css
          test -s web-dist/ui-motion.js
          test -s web-dist/preferences-lite.js
          test -s web-dist/i18n.js
          test -s web-dist/ui-shell.js
          test -s web-dist/app-locale.js
          test -s web-dist/locales/zh-CN.js
          test -s web-dist/locales/en-US.js
      - name: Validate locale resources
        run: |
          npm run build:web
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{}};
          vm.createContext(ctx);
          for(const file of ['web-dist/locales/zh-CN.js','web-dist/locales/en-US.js']) vm.runInContext(fs.readFileSync(file,'utf8'),ctx,{filename:file});
          const locales=ctx.window.ColorPaletteLocales;
          const zh=locales?.['zh-CN'],en=locales?.['en-US'];
          if(!zh?.ui||!en?.ui||!zh?.relations||!en?.relations||!zh?.relationDescriptions||!en?.relationDescriptions||!zh?.modes||!en?.modes) throw new Error('Locale resources missing');
          const requireKeys=(a,b,path)=>{const missing=Object.keys(a).filter(key=>!(key in b));if(missing.length)throw new Error(`Missing locale keys at ${path}: ${missing.join(',')}`)};
          requireKeys(zh.ui,en.ui,'ui'); requireKeys(en.ui,zh.ui,'ui');
          requireKeys(zh.relations,en.relations,'relations'); requireKeys(en.relations,zh.relations,'relations');
          requireKeys(zh.relationDescriptions,en.relationDescriptions,'relationDescriptions'); requireKeys(en.relationDescriptions,zh.relationDescriptions,'relationDescriptions');
          requireKeys(zh.modes,en.modes,'modes'); requireKeys(en.modes,zh.modes,'modes');
          const keys=Object.keys(zh.ui); if(keys.some(k=>/[\u4e00-\u9fff]/.test(k))) throw new Error(`Locale key contains Chinese text: ${keys.filter(k=>/[\u4e00-\u9fff]/.test(k)).join(',')}`);
          console.log(`Locale resources OK: ${keys.length} shared semantic UI keys`);
          NODE
      - name: Validate generated web data
        run: |
          npm run build:data
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('web/data/colors.json','utf8'));
          if(!Array.isArray(d.colors)||!d.colors.length) throw new Error('Generated color data is empty');
          const missing=d.colors.filter(c=>typeof c.nameEn!=='string'||!c.nameEn.trim()); if(missing.length) throw new Error(`Missing English color names: ${missing.length}`);
          const cjk=/[\u4e00-\u9fff]/; const hexSuffix=/#(?:[0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?:\b|$)/;
          const mixed=d.colors.filter(c=>cjk.test(c.nameEn)); if(mixed.length) throw new Error(`English color names contain CJK text: ${mixed.slice(0,5).map(c=>c.name).join(', ')}`);
          const suffixed=d.colors.filter(c=>hexSuffix.test(c.nameEn)); if(suffixed.length) throw new Error(`English color names contain HEX suffixes: ${suffixed.slice(0,5).map(c=>`${c.nameEn} -> ${c.hex}`).join(', ')}`);
          console.log(`Generated color data OK: ${d.colors.length} locale-safe colors without HEX-suffixed names`);
          NODE
      - name: Reject JavaScript source files
        run: |
          if find core web tests -name '*.js' -print -quit | grep -q .; then
            echo 'JavaScript source files remain under core/, web/, or tests/.'
            exit 1
          fi
          if git grep -nE '\.(js)([^A-Za-z]|$)' -- ':!README.md' ':!docs/**'; then
            echo 'JavaScript source references remain in product files.'
            exit 1
          fi
