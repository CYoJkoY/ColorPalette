name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate named color data
        run: node web/build-data.js

      - name: Validate Pages bundle
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/preferences-ui.css
          test -s web/create-redesign.css
          test -s web/ui-motion.css
          test -s web/ui-motion.js
          test -s web/preferences-lite.js
          test -s web/i18n.js
          test -s web/ui-shell.js
          test -s web/app-locale.js
          test -s web/build-data.js
          test -s web/locales/zh-CN.js
          test -s web/locales/en-US.js
          test -s web/data/colors.json
          ! grep -R -nE 'web/(app|runtime-fixes|i18n-runtime|discover-redesign|create-redesign|create-number-controls)\.js' web/index.html .github/workflows || true
          node -e "const fs=require('fs'); const html=fs.readFileSync('web/index.html','utf8'); for (const src of ['app-locale.js','preferences-lite.js','i18n.js','ui-shell.js']) if(!html.includes(src)) throw new Error('Missing script '+src); const d=require('./web/data/colors.json'); if(!Array.isArray(d.colors)||!d.colors.length) throw new Error('Generated color data is empty'); if(d.colors.some(c=>typeof c.nameEn!=='string'||!c.nameEn.trim()||/[\\u4e00-\\u9fff]/.test(c.nameEn))) throw new Error('Generated English color names are invalid'); console.log('Generated '+d.colors.length+' locale-safe colors')"

      - name: Disable Jekyll processing
        run: touch web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
