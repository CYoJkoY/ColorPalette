name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build application
        run: |
          npm run build:data
          npm run build:web
          rm -rf site
          mkdir -p site
          rsync -a web/ site/ --exclude='*.ts'
          rsync -a web-dist/ site/
          touch site/.nojekyll
      - name: Validate Pages bundle
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/preferences-ui.css
          test -s site/create-redesign.css
          test -s site/ui-motion.css
          test -s site/ui-motion.js
          test -s site/preferences-lite.js
          test -s site/i18n.js
          test -s site/ui-shell.js
          test -s site/app-locale.js
          test -s site/locales/zh-CN.js
          test -s site/locales/en-US.js
          test -s site/data/colors.json
          if find site -name '*.ts' -print -quit | grep -q .; then echo 'TypeScript source leaked into Pages artifact'; exit 1; fi
          node -e "const fs=require('fs'); const html=fs.readFileSync('site/index.html','utf8'); for (const src of ['app-locale.js','preferences-lite.js','i18n.js','ui-shell.js']) if(!html.includes(src)) throw new Error('Missing script '+src); const d=require('./site/data/colors.json'); if(!Array.isArray(d.colors)||!d.colors.length) throw new Error('Generated color data is empty'); const cjk=/[\\u4e00-\\u9fff]/; const hexSuffix=/#(?:[0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})(?:\\b|$)/; if(d.colors.some(c=>typeof c.nameEn!=='string'||!c.nameEn.trim()||cjk.test(c.nameEn)||hexSuffix.test(c.nameEn))) throw new Error('Generated English color names are invalid'); console.log('Pages bundle contains '+d.colors.length+' locale-safe colors')"
      - name: Disable Jekyll processing
        run: touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
