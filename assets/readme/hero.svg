    <text x="72" y="154" font-size="62" font-weight="800" fill="#1D1D1B">ColorPalette</text>
    <text x="72" y="198" font-size="25" font-weight="600" fill="#44443F">Extract. Explore. Relate. Create.</text>
    <text x="72" y="234" font-size="19" fill="#77776F">A native WeChat Mini Program for practical color work.</text>
    <g transform="translate(72 286)">
      <rect width="126" height="42" rx="14" fill="#1D1D1B"/>
