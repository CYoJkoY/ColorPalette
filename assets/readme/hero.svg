    <text x="30" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#77776F">PALETTE RELATIONSHIPS</text>
    <rect x="30" y="66" width="384" height="86" rx="18" fill="#F4F4EF"/>
    <rect x="48" y="84" width="74" height="50" rx="12" fill="#6D28D9"/>
