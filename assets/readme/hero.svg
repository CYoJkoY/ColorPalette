<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">ColorPalette — Color research and palette making for WeChat</title>
  <desc id="desc">A visual color workspace for extracting colors from images, exploring named color systems, analyzing color relationships, and building palettes.</desc>
  <rect width="1200" height="520" fill="#F7F7F4"/>
  <path d="M0 424C170 374 280 482 470 428C650 378 780 328 1200 404V520H0Z" fill="#ECECE6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
