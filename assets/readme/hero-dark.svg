<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">ColorPalette — dark mode hero</title>
  <desc id="desc">A dark-mode GitHub README hero for ColorPalette, showing image extraction, color library, palette creation, and color relationships.</desc>
  <rect width="1200" height="620" rx="32" fill="#0D1117"/>
  <circle cx="1080" cy="90" r="120" fill="#211B35"/>
  <circle cx="120" cy="560" r="150" fill="#102532"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="68" font-size="15" font-weight="800" letter-spacing="4" fill="#9EA7B3">COLOR WORKSPACE</text>
    <text x="600" y="126" font-size="52" font-weight="800" fill="#F0F6FC">ColorPalette</text>
    <text x="600" y="164" font-size="22" font-weight="600" fill="#D6DCE4">Extract. Explore. Relate. Create.</text>
    <text x="600" y="194" font-size="17" fill="#9EA7B3">A local-first browser workspace for practical color work.</text>
  </g>
  <g transform="translate(248 222)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="210" height="48" rx="16" fill="#F0F6FC"/>
    <text x="105" y="31" font-size="16" font-weight="700" fill="#0D1117">Image extraction</text>
    <rect x="242" y="0" width="210" height="48" rx="16" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <text x="347" y="31" font-size="16" font-weight="700" fill="#F0F6FC">Color library</text>
    <rect x="484" y="0" width="210" height="48" rx="16" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <text x="589" y="31" font-size="16" font-weight="700" fill="#F0F6FC">Palette Studio</text>
  </g>
  <g transform="translate(150 300)">
    <rect width="900" height="244" rx="28" fill="#161B22" stroke="#F0F6FC" stroke-width="2"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle">
      <text x="450" y="40" font-size="14" font-weight="800" letter-spacing="2.5" fill="#9EA7B3">PALETTE RELATIONSHIPS</text>
      <text x="450" y="72" font-size="21" font-weight="800" fill="#F0F6FC">One color → many useful systems</text>
      <text x="450" y="98" font-size="15" fill="#9EA7B3">Analogous · Complementary · Triadic · Tetradic · Monochromatic</text>
    </g>
    <g transform="translate(70 124)">
      <rect width="170" height="72" rx="16" fill="#A78BFA"/>
      <rect x="180" width="170" height="72" rx="16" fill="#7C3AED"/>
      <rect x="360" width="170" height="72" rx="16" fill="#2563EB"/>
      <rect x="540" width="170" height="72" rx="16" fill="#10B981"/>
    </g>
  </g>
  <text x="600" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" text-anchor="middle" font-size="14" fill="#9EA7B3">HEX · RGB · HSL · OKLab · OKLCH · WCAG contrast</text>
</svg>
